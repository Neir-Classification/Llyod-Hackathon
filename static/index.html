<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insurance Policy Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(255, 255, 255, 0.06);
      --accent: #0ea5e9;
      --accent-2: #f97316;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.12);
      --shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      --user-bg: rgba(14, 165, 233, 0.15);
      --assistant-bg: rgba(249, 115, 22, 0.08);
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      font-family: 'Sora', 'Segoe UI', sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, rgba(14,165,233,0.12), transparent 35%),
                  radial-gradient(circle at 80% 0%, rgba(249,115,22,0.14), transparent 40%),
                  var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    
    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    
    h1 { 
      margin: 0; 
      font-size: 24px; 
      letter-spacing: -0.02em;
    }
    
    .tagline { 
      color: var(--muted); 
      font-size: 14px; 
      margin: 0;
    }
    
    .badge { 
      padding: 6px 12px; 
      border-radius: 8px; 
      background: rgba(14,165,233,0.12); 
      color: var(--accent); 
      font-weight: 700; 
      font-size: 12px; 
    }
    
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
    }
    
    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .message.user {
      justify-content: flex-end;
    }
    
    .message.user .bubble {
      background: var(--user-bg);
      border: 1px solid rgba(14, 165, 233, 0.4);
      color: #e0f2fe;
    }
    
    .message.assistant .bubble {
      background: var(--assistant-bg);
      border: 1px solid rgba(249, 115, 22, 0.3);
      color: var(--text);
    }
    
    .bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      word-wrap: break-word;
      line-height: 1.5;
      font-size: 14px;
    }
    
    .message.assistant .bubble audio {
      width: 100%;
      margin-top: 8px;
      height: 32px;
    }
    
    .input-area {
      padding: 24px 0;
      border-top: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(8px);
    }
    
    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    
    .input-controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .text-input-row {
      display: flex;
      gap: 8px;
    }
    
    #message-input {
      flex: 1;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 100px;
    }
    
    #message-input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255,255,255,0.06);
    }
    
    .button-group {
      display: flex;
      gap: 8px;
    }
    
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    
    button:hover {
      background: rgba(255,255,255,0.08);
      border-color: var(--accent);
    }
    
    button.primary {
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      border: none;
      color: white;
      box-shadow: 0 10px 30px rgba(14,165,233,0.25);
    }
    
    button.primary:hover {
      transform: translateY(-1px);
    }
    
    button.primary:active {
      transform: translateY(0px) scale(0.99);
    }
    
    button.recording {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }
    
    .controls-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .control-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    
    .control-group label {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      font-weight: 500;
    }
    
    select {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 12px;
    }
    
    .status {
      font-size: 12px;
      color: var(--muted);
      min-height: 18px;
    }
    
    .status.recording {
      color: #fca5a5;
      font-weight: 600;
    }
    
    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
    }
    
    .empty-state h2 {
      margin: 0 0 8px;
      font-size: 18px;
      color: var(--text);
    }
    
    .empty-state p {
      margin: 0;
      font-size: 14px;
    }
    
    @media (max-width: 640px) {
      .bubble {
        max-width: 85%;
      }
      
      .input-wrapper {
        flex-direction: column;
      }
      
      .text-input-row {
        flex-direction: column;
      }
      
      button {
        font-size: 12px;
        padding: 9px 12px;
      }
      
      .controls-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }
    
    /* Scrollbar styling */
    .chat-history::-webkit-scrollbar {
      width: 6px;
    }
    
    .chat-history::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .chat-history::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
    }
    
    .chat-history::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Insurance Policy Chat</h1>
      <p class="tagline">Ask about your policy coverage</p>
    </div>
    <span class="badge">Live Chat</span>
  </header>

  <div class="container">
    <div class="chat-history" id="chat-history">
      <div class="empty-state">
        <h2>Welcome to Policy Chat</h2>
        <p>Ask about your insurance coverage by typing or speaking</p>
      </div>
    </div>

    <div class="input-area">
      <div class="status" id="status"></div>
      
      <div class="input-wrapper">
        <div class="input-controls">
          <div class="text-input-row">
            <textarea 
              id="message-input" 
              placeholder="Type your question about your policy... or use the voice button" 
              rows="1"
            ></textarea>
            <button id="send-btn" class="primary" type="button">Send</button>
          </div>
          
          <div class="controls-row">
            <div class="button-group">
              <button id="voice-input-btn" type="button">🎤 Voice Input</button>
              <button id="voice-output-toggle" type="button">🔊 Auto-play Voice</button>
            </div>
            
            <div class="control-group">
              <label for="tone-select">Tone:</label>
              <select id="tone-select">
                <option value="neutral">Neutral</option>
                <option value="confused">Confused</option>
                <option value="angry">Frustrated</option>
                <option value="happy">Happy</option>
                <option value="anxious">Anxious</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const chatHistory = document.getElementById('chat-history');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const voiceInputBtn = document.getElementById('voice-input-btn');
    const voiceOutputToggle = document.getElementById('voice-output-toggle');
    const toneSelect = document.getElementById('tone-select');
    const statusEl = document.getElementById('status');

    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let isVoiceOutputEnabled = false;

    const preferredMime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 
                         (MediaRecorder.isTypeSupported('audio/ogg') ? 'audio/ogg' : 
                         (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : ''));

    function setStatus(text) {
      statusEl.textContent = text;
      statusEl.classList.remove('recording');
    }

    function setStatusRecording(text) {
      statusEl.textContent = text;
      statusEl.classList.add('recording');
    }

    function addMessageToChat(text, isUser) {
      const chatDiv = document.createElement('div');
      chatDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
      
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      
      chatDiv.appendChild(bubble);
      
      // Remove empty state if first message
      if (chatHistory.querySelector('.empty-state')) {
        chatHistory.innerHTML = '';
      }
      
      chatHistory.appendChild(chatDiv);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function addAudioToLastMessage(audioBlob) {
      const lastMessage = chatHistory.querySelector('.message.assistant:last-child');
      if (!lastMessage) return;
      
      const bubble = lastMessage.querySelector('.bubble');
      const audioEl = document.createElement('audio');
      audioEl.controls = true;
      audioEl.src = URL.createObjectURL(audioBlob);
      bubble.appendChild(audioEl);
      
      if (isVoiceOutputEnabled) {
        audioEl.play();
      }
    }

    async function sendMessage(text) {
      if (!text.trim()) return;

      addMessageToChat(text, true);
      messageInput.value = '';
      messageInput.style.height = 'auto';

      setStatus('Processing query...');

      try {
        // Query the RAG pipeline
        const response = await fetch('/rag-query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query: text,
            tone: toneSelect.value,
            k: 2
          })
        });

        if (!response.ok) {
          throw new Error(await response.text());
        }

        const data = await response.json();
        addMessageToChat(data.response, false);

        setStatus('Generating voice response...');

        // Convert response to speech
        const ttsResponse = await fetch('/text-to-speech', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: data.response,
            voice: 'coral',
            audio_format: 'mp3'
          })
        });

        if (!ttsResponse.ok) {
          throw new Error(await ttsResponse.text());
        }

        const audioBlob = await ttsResponse.blob();
        addAudioToLastMessage(audioBlob);
        setStatus('');
      } catch (err) {
        console.error(err);
        addMessageToChat(`Error: ${err.message}`, false);
        setStatus(`Error: ${err.message}`);
      }
    }

    async function startVoiceInput() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        mediaRecorder = preferredMime ? 
          new MediaRecorder(stream, { mimeType: preferredMime }) : 
          new MediaRecorder(stream);
        
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };
        
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          setStatusRecording('Transcribing...');

          try {
            const mime = preferredMime || 'audio/webm';
            const ext = mime.includes('ogg') ? 'ogg' : 
                       (mime.includes('mp4') ? 'mp4' : 'webm');
            const file = new File(recordedChunks, `recording.${ext}`, { type: mime });

            const formData = new FormData();
            formData.append('audio_file', file);

            const response = await fetch('/speech-to-text', {
              method: 'POST',
              body: formData
            });

            if (!response.ok) throw new Error(await response.text());
            const data = await response.json();
            
            setStatus('');
            await sendMessage(data.text);
          } catch (err) {
            console.error(err);
            setStatus(`Transcription error: ${err.message}`);
          }
        };

        mediaRecorder.start();
        isRecording = true;
        voiceInputBtn.textContent = '⏹️ Stop Recording';
        setStatusRecording('Recording...');
      } catch (err) {
        console.error(err);
        setStatus('Microphone access denied. Please enable microphone access in your browser.');
      }
    }

    function stopVoiceInput() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        voiceInputBtn.textContent = '🎤 Voice Input';
      }
    }

    // Auto-resize textarea
    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
    });

    // Send on Enter (Shift+Enter for new line)
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(messageInput.value);
      }
    });

    sendBtn.addEventListener('click', () => {
      sendMessage(messageInput.value);
    });

    voiceInputBtn.addEventListener('click', () => {
      if (!isRecording) {
        startVoiceInput();
      } else {
        stopVoiceInput();
      }
    });

    voiceOutputToggle.addEventListener('click', () => {
      isVoiceOutputEnabled = !isVoiceOutputEnabled;
      voiceOutputToggle.style.opacity = isVoiceOutputEnabled ? '1' : '0.6';
    });

    // Focus message input on load
    messageInput.focus();
  </script>
</body>
</html>
